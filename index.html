<style>

html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background-image:radial-gradient(700px 420px at 92% -5%,var(--g1),transparent),radial-gradient(520px 380px at 0% 30%,var(--g2),transparent);background-attachment:fixed}

.mu{color:var(--mu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.4rem;border-radius:.95rem;font-weight:600;transition:.2s;cursor:pointer;border:1px solid var(--bd);color:var(--tx)}
.btn-p{background:linear-gradient(135deg,var(--ac),#3b82f6);color:#fff;border:0;box-shadow:0 0 24px rgba(99,102,241,.4)}
.btn:hover{transform:translateY(-2px)}
.grad{background:linear-gradient(90deg,#818cf8,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.opt{display:flex;gap:.9rem;align-items:center;width:100%;text-align:left;padding:.9rem;border-radius:1.1rem;border:1px solid var(--bd);background:var(--card2);cursor:pointer;transition:.2s;color:var(--tx)}
.opt:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 0 0 1px var(--ac),0 8px 28px rgba(99,102,241,.25)}
.oi{font-size:1.6rem;width:3rem;height:3rem;display:grid;place-items:center;border-radius:.9rem;background:rgba(99,102,241,.16);flex:none}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.chip{padding:.45rem .9rem;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:.9rem;color:var(--tx)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sc{cursor:pointer;transition:.25s;padding:1.25rem}.sc:hover{transform:translateY(-5px);border-color:var(--cy);box-shadow:0 0 28px rgba(34,211,238,.18)}
.tag{font-size:.75rem;font-weight:700;padding:.2rem .6rem;border-radius:.5rem;background:rgba(99,102,241,.18);color:var(--cy)}
.hash{font-size:.7rem;padding:.15rem .5rem;border-radius:.5rem;background:rgba(34,211,238,.12);color:var(--cy)}
.trk{height:.5rem;border-radius:9px;background:var(--bd);overflow:hidden}
.fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--cy));transition:width .5s}
.donut{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--ac),var(--cy) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;position:relative;flex:none}
.donut::before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--card)}
.donut span{position:relative;font-weight:800;font-size:1.15rem}
#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem}
#modal.open{display:flex}
#mbox{max-height:90vh;overflow-y:auto;max-width:42rem;width:100%;padding:1.5rem;background:var(--bg)}
details{padding:1rem 1.2rem}summary{cursor:pointer;font-weight:600}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--hd);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
</style>
</head>

['📊','Стабильность, понятный карьерный рост и управление процессами','Тұрақтылық, түсінікті мансаптық өсу және процестерді басқару','opud tms'],
['🌱','Приносить реальную пользу природе, животным и экологии','Табиғатқа, жануарларға және экологияға нақты пайда әкелу','vt rh']]]
];

const F=[
[['С чего начать выбор специальности?','Мамандықты таңдауды неден бастау керек?'],['Определи, что тебе нравится делать: работать с кодом, техникой, людьми, химией или животными. Пройди тест на этом сайте, затем прочитай модули выбранных специальностей и сравни их со своими интересами.','Не істегенді ұнататыныңды анықта: кодпен, техникамен, адамдармен, химиямен немесе жануарлармен жұмыс. Осы сайттағы тестті тапсырып, таңдаған мамандықтардың модульдерін оқы да, қызығушылықтарыңмен салыстыр.']],
[['На что опираться при выборе?','Таңдауда неге сүйену керек?'],['Опирайся на сильные школьные предметы, на реальные интересы и на то, где хочешь работать: в офисе, на производстве или на природе. Зарплата важна, но без интереса к делу быстро наступает выгорание.','Мектептегі күшті пәндерге, нақты қызығушылыққа және қайда жұмыс істегің келетініне сүйен: кеңседе, өндірісте немесе табиғатта. Жалақы маңызды, бірақ іске қызығушылық болмаса, тез шаршайсың.']],
[['Есть ли очное и заочное отделения?','Күндізгі және сырттай бөлім бар ма?'],['Да, в колледже предусмотрены очное и заочное (сырттай) обучение. Заочная форма подходит тем, кто уже работает. Перечень специальностей по каждой форме уточняйте в приёмной комиссии.','Иә, колледжде күндізгі және сырттай оқу бар. Сырттай форма жұмыс істеп жүргендерге ыңғайлы. Әр форма бойынша мамандықтар тізімін қабылдау комиссиясынан нақтылаңыз.']],
[['Можно ли сменить специальность?','Мамандықты ауыстыруға бола ма?'],['Лучше определиться на первом курсе: общие предметы схожи, и перевод проще. Условия перевода уточняйте у кураторов и в учебной части.','Бірінші курста анықтаған жөн: жалпы пәндер ұқсас, ауысу оңайырақ. Ауысу шарттарын кураторлардан және оқу бөлімінен нақтылаңыз.']],
[['Как использовать результат теста?','Тест нәтижесін қалай қолдану керек?'],['Тест — это подсказка, а не приговор. Прочитай карточки ТОП-3 специальностей, поговори с кураторами и студентами старших курсов, а затем прими решение сам.','Тест — бұл кеңес, үкім емес. ТОП-3 мамандықтың карточкаларын оқы, кураторлармен және жоғары курс студенттерімен сөйлес, содан кейін шешімді өзің қабыл ал.']]
];

const lx=i=>L==='ru'?0:1;
const t=k=>T[L][k];
const spById=id=>S.find(s=>s.id===id);

function applyStatic(){
  document.documentElement.lang=L;
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.getElementById('l-ru').classList.toggle('on',L==='ru');
  document.getElementById('l-kk').classList.toggle('on',L==='kk');
  document.title=L==='ru'?'ПрофКомпас ВИТК — Навигатор профессий колледжа':'ПрофКомпас ВИТК — Колледж мамандықтарының навигаторы';
  document.getElementById('faqbox').innerHTML=F.map(f=>`<details class="glass"><summary>${f[0][lx()]}</summary><p class="mu mt-3 text-sm">${f[1][lx()]}</p></details>`).join('');
}
function setLang(l){L=l;applyStatic();setTheme(TH);renderQuiz();renderCatalog();if(openId)openM(openId);}

const W=c=>{const o={};c.split(' ').forEach((k,n)=>o[k]=n?2:3);return o};
const TG={po:'РаботаВIT,СвоёДело,Удалёнка|IT_жұмыс,Жеке_кәсіп,Қашықтан',engm:'Нефтегаз,ВысокаяЗП,Вахта|Мұнай_газ,Жоғары_жалақы,Вахта',tpng:'Нефтегаз,Лаборатория,ВысокаяЗП|Мұнай_газ,Зертхана,Жоғары_жалақы',els:'Энергетика,СвоёДело,Стабильность|Энергетика,Жеке_кәсіп,Тұрақтылық',tor:'Автомобили,СвоёДело,РаботаРуками|Автокөлік,Жеке_кәсіп,Қол_еңбегі',opud:'Логистика,Стабильность,Управление|Логистика,Тұрақтылық,Басқару',tms:'РаботаРуками,Промышленность,Чертежи|Қол_еңбегі,Өнеркәсіп,Сызбалар',mmt:'Нефтегаз,ВысокаяЗП,Монтаж|Мұнай_газ,Жоғары_жалақы,Монтаж',rh:'Экология,СвоёДело,Природа|Экология,Жеке_кәсіп,Табиғат',vt:'Животные,Клиника,Природа|Жануарлар,Клиника,Табиғат'};
const tg=id=>TG[id].split('|')[lx()].split(',').map(x=>`<span class="hash">#${x}</span>`).join('');
let TH='dark';
function setTheme(m){TH=m;document.documentElement.dataset.theme=m;document.getElementById('theme-btn').textContent=m==='dark'?'☀️':'🌙';}
const hist=[];
function renderQuiz(){
  const b=document.getElementById('qbox'),i=lx();
  if(done){
    const r=Object.entries(sc).sort((a,b)=>b[1]-a[1]).slice(0,3),top=r[0][1]||1;
    const P=r.map(([id,v])=>[spById(id),Math.min(98,Math.round(v/top*98))]);
    b.innerHTML=`<div class="fade"><h3 class="text-xl font-bold mb-4">🎯 ${t('res')}</h3>
    <div class="flex items-center gap-4 mb-5"><div class="donut" style="--p:${P[0][1]}"><span>${P[0][1]}%</span></div><div><div class="text-xs mu">TOP-1</div><div class="font-bold text-lg">${P[0][0].e} ${P[0][0].n[i]}</div></div></div><div class="space-y-4">`+
    P.map(([s,p],n)=>`<div class="rounded-2xl p-4" style="background:var(--card2);border:1px solid var(--bd)"><div class="flex justify-between items-center gap-2"><div class="font-bold">${n+1}. ${s.e} ${s.n[i]} <span class="tag">${s.c}</span></div><div class="font-bold grad">${p}%</div></div>
    <div class="trk mt-3"><div class="fill" style="width:${p}%"></div></div>
    <div class="flex flex-wrap gap-1 mt-3">${tg(s.id)}</div>
    <p class="text-sm mt-3"><b>${t('why')}:</b> <span class="mu">${t('why2')}${s.d[i]}.</span></p>
    <button class="btn btn-p mt-3 text-sm" onclick="openM('${s.id}')">${t('more')}</button></div>`).join('')+
    `</div><button class="btn mt-5 w-full" onclick="resetQuiz()">↻ ${t('retry')}</button></div>`;return;}
  const q=Q[qi],pc=Math.round(qi/Q.length*100);
  b.innerHTML=`<div class="flex justify-between text-sm mu mb-2"><span>${t('q')} ${qi+1} ${t('of')} ${Q.length}</span><span>${pc}%</span></div>
  <div class="trk mb-5"><div class="fill" style="width:${pc}%"></div></div>
  <div class="fade"><h3 class="text-lg sm:text-2xl font-bold mb-5">${q[0][i]}</h3><div class="space-y-3">`+
  q[1].map((o,n)=>`<button class="opt" onclick="answer(${n})"><span class="oi">${o[0]}</span><span>${o[1+i]}</span></button>`).join('')+
  `</div>${qi?`<button class="btn mt-5 text-sm" onclick="goBack()">${t('back')}</button>`:''}</div>`;
}
function answer(n){
  const w=W(Q[qi][1][n][3]);hist.push(w);
  for(const k in w)sc[k]=(sc[k]||0)+w[k];
  if(qi<Q.length-1)qi++;else done=true;
  renderQuiz();
}
function goBack(){const w=hist.pop();for(const k in w)sc[k]-=w[k];qi--;renderQuiz();}
function resetQuiz(){qi=0;sc={};done=false;hist.length=0;renderQuiz();document.getElementById('quiz').scrollIntoView();}

function renderCatalog(){
  document.getElementById('filters').innerHTML=['all',...SP].map(k=>`<button class="chip ${filt===k?'on':''}" onclick="filt='${k}';renderCatalog()">${k==='all'?t('all'):t('sp')[k]}</button>`).join('');
  const i=lx();
  document.getElementById('grid').innerHTML=S.filter(s=>filt==='all'||s.s===filt).map(s=>`<div class="glass sc fade" onclick="openM('${s.id}')">
   <div class="flex justify-between items-start"><div class="text-3xl">${s.e}</div><span class="tag">${s.c}</span></div>
   <h3 class="font-bold mt-3">${s.n[i]}</h3><div class="flex flex-wrap gap-1 mt-2">${tg(s.id)}</div><p class="text-xs mu mt-1">${t('sp')[s.s]}</p>
   <p class="text-sm mu mt-3">${s.d[i][0].toUpperCase()+s.d[i].slice(1)}.</p>
   <p class="text-sm mt-3"><b>${t('jobs')}:</b> <span class="mu">${s.j[i]}</span></p></div>`).join('');
}

function openM(id){
  openId=id;const s=spById(id),i=lx();
  const bars=[1,2,3].map(n=>`<span class="inline-block h-2 w-10 rounded mr-1" style="background:${n<=s.dem?'var(--em)':'var(--bd)'}"></span>`).join('');
  document.getElementById('mbox').innerHTML=`<div class="flex justify-between items-start gap-3"><div><span class="tag">${t('code')}: ${s.c}</span><h3 class="text-xl font-bold mt-2">${s.e} ${s.n[i]}</h3><p class="text-xs mu">${t('sp')[s.s]}</p><div class="flex flex-wrap gap-1 mt-2">${tg(s.id)}</div></div><button class="btn glass !py-1 !px-3" onclick="closeM()" aria-label="${t('close')}">✕</button></div>
  <p class="mu mt-4 text-sm">${s.d[i][0].toUpperCase()+s.d[i].slice(1)}.</p>
  <h4 class="font-bold mt-5 mb-2">📚 ${t('mods')}</h4><ul class="text-sm mu list-disc pl-5 space-y-1">${s.m[i].split('|').map(x=>`<li>${x}</li>`).join('')}</ul>
  <h4 class="font-bold mt-5 mb-1">🛠 ${t('hard')}</h4><p class="text-sm mu">${s.h[i]}</p>
  <h4 class="font-bold mt-4 mb-1">🤝 ${t('soft')}</h4><p class="text-sm mu">${s.f[i]}</p>
  <h4 class="font-bold mt-5 mb-1">💼 ${t('work')}</h4><p class="text-sm"><b>${s.j[i]}</b></p><p class="text-sm mu mt-1">${s.w[i]}</p>
  <h4 class="font-bold mt-5 mb-2">📈 ${t('dem')}: <span class="grad">${t('dl')[s.dem]}</span></h4><div>${bars}</div><p class="text-xs mu mt-2">${t('note')}</p>`;
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeM(){openId=null;document.getElementById('modal').classList.remove('open');document.body.style.overflow='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
applyStatic();setTheme('dark');renderQuiz();renderCatalog();
</script>
</body>
</html>
