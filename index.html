<style>

html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;margin:0;background-image:radial-gradient(700px 420px at 92% -5%,var(--g1),transparent),radial-gradient(520px 380px at 0% 30%,var(--g2),transparent);background-attachment:fixed}

.mu{color:var(--mu)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.8rem 1.4rem;border-radius:.95rem;font-weight:600;transition:.2s;cursor:pointer;border:1px solid var(--bd);color:var(--tx)}
.btn-p{background:linear-gradient(135deg,var(--ac),#3b82f6);color:#fff;border:0;box-shadow:0 0 24px rgba(99,102,241,.4)}
.btn:hover{transform:translateY(-2px)}
.grad{background:linear-gradient(90deg,#818cf8,var(--cy));-webkit-background-clip:text;background-clip:text;color:transparent}
.opt{display:flex;gap:.9rem;align-items:center;width:100%;text-align:left;padding:.9rem;border-radius:1.1rem;border:1px solid var(--bd);background:var(--card2);cursor:pointer;transition:.2s;color:var(--tx)}
.opt:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 0 0 1px var(--ac),0 8px 28px rgba(99,102,241,.25)}
.oi{font-size:1.6rem;width:3rem;height:3rem;display:grid;place-items:center;border-radius:.9rem;background:rgba(99,102,241,.16);flex:none}
.fade{animation:fd .35s ease}
@keyframes fd{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.chip{padding:.45rem .9rem;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-size:.9rem;color:var(--tx)}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.sc{cursor:pointer;transition:.25s;padding:1.25rem}.sc:hover{transform:translateY(-5px);border-color:var(--cy);box-shadow:0 0 28px rgba(34,211,238,.18)}
.tag{font-size:.75rem;font-weight:700;padding:.2rem .6rem;border-radius:.5rem;background:rgba(99,102,241,.18);color:var(--cy)}
.hash{font-size:.7rem;padding:.15rem .5rem;border-radius:.5rem;background:rgba(34,211,238,.12);color:var(--cy)}
.trk{height:.5rem;border-radius:9px;background:var(--bd);overflow:hidden}
.fill{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--cy));transition:width .5s}
.donut{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--ac),var(--cy) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;position:relative;flex:none}
.donut::before{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--card)}
.donut span{position:relative;font-weight:800;font-size:1.15rem}
#modal{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:1rem}
#modal.open{display:flex}
#mbox{max-height:90vh;overflow-y:auto;max-width:42rem;width:100%;padding:1.5rem;background:var(--bg)}
details{padding:1rem 1.2rem}summary{cursor:pointer;font-weight:600}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--hd);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
</style>
</head>
